name: PowerStig dev offline package

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore build dependencies
        shell: powershell
        run: .\build.ps1 -ResolveDependency -Tasks noop

      - name: Build and run unit tests
        shell: powershell
        run: .\build.ps1

      - name: Convert STIG data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tools\StigUpdate\Invoke-StigUpdate.ps1 -WhatIf
          .\Tools\StigUpdate\Invoke-StigUpdate.ps1 -Verbose

          $report = Get-Content .\Tools\StigUpdate\last-update-report.json -Raw | ConvertFrom-Json
          if (-not $report.Succeeded) {
              throw 'STIG conversion failed; inspect Tools\StigUpdate\last-update-report.json.'
          }

          $failedItems = @($report.Items | Where-Object Status -ne 'Converted')
          if ($failedItems.Count -gt 0) {
              $failedItems | Format-Table Archive, Status, Error | Out-String | Write-Error
          }

          $dcPath = '.\source\StigData\Processed\WindowsServer-2025-DC-1.4.xml'
          [xml] $dcStig = Get-Content -LiteralPath $dcPath -Raw
          $conditionalRegistryRule = $dcStig.SelectSingleNode("//DocumentRule/Rule[@id='V-278001.c']")
          $sysvolRule = $dcStig.SelectSingleNode("//Rule[@id='V-278139']")
          $telemetryRule = $dcStig.SelectSingleNode("//Rule[@id='V-278103']")
          if ($null -eq $conditionalRegistryRule -or $sysvolRule.dscresource -ne 'NTFSAccessEntry' -or $sysvolRule.Force -ne 'True' -or @($sysvolRule.AccessControlEntry.Entry).Count -ne 5 -or $telemetryRule.ValueData -ne '0') {
              throw 'Windows Server 2025 DC STIG rule processing did not produce the expected ACL and telemetry data.'
          }

      - name: Export module and restore exact runtime dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tools\StigUpdate\Export-PowerStigModule.ps1 -Destination .\output -Force

          $manifest = Import-PowerShellDataFile .\source\PowerStig.psd1
          foreach ($dependency in $manifest.RequiredModules) {
              $version = [version] $dependency.ModuleVersion
              $expectedPath = Join-Path $PWD "output\$($dependency.ModuleName)\$version"
              if (-not (Test-Path -LiteralPath $expectedPath -PathType Container)) {
                  Save-Module `
                      -Name $dependency.ModuleName `
                      -RequiredVersion $version `
                      -Path .\output `
                      -Force
              }
          }

      - name: Create and smoke-test offline package
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tools\Deployment\New-PowerStigOfflinePackage.ps1 -ModuleRoot .\output -Force

          $version = (Import-PowerShellDataFile .\source\PowerStig.psd1).ModuleVersion
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version$([Environment]::NewLine)", [Text.UTF8Encoding]::new($false))
          $package = Join-Path $PWD "Tools\Deployment\Packages\PowerStig-Windows-Offline-$version.ps1"
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
              throw "Offline package was not created: $package"
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'PowerStigOfflineSmokeTest'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -NoProfile -ExecutionPolicy Bypass -File $package `
              -Mode ExtractOnly -ExtractRoot $extractRoot -ForceExtract
          if ($LASTEXITCODE -ne 0) {
              throw "Offline package extraction smoke test failed with exit code $LASTEXITCODE."
          }

          $metadata = Get-Content (Join-Path $extractRoot 'PackageMetadata.json') -Raw | ConvertFrom-Json
          if (-not $metadata.Modules -or -not (Test-Path (Join-Path $extractRoot 'Scripts\Deploy-PowerStigWindows.ps1'))) {
              throw 'The extracted package is missing required module metadata or deployment entry point.'
          }

            $artifactDirectory = Join-Path $env:RUNNER_TEMP 'PowerStigOfflineArtifact'
            New-Item -Path $artifactDirectory -ItemType Directory -Force | Out-Null
            Copy-Item -LiteralPath $package -Destination $artifactDirectory -Force
            $guide = Join-Path $PWD 'Tools\Deployment\PowerStig-Windows-Operator-Guide.zh-CN.md'
            if (-not (Test-Path -LiteralPath $guide -PathType Leaf)) {
              throw "Deployment guide was not found: $guide"
            }
            Copy-Item -LiteralPath $guide -Destination (Join-Path $artifactDirectory 'PowerStig-Windows-Deployment-Guide.zh-CN.md') -Force

      - name: Test deployment compilation without applying settings
        shell: powershell
        run: |
          $version = (Import-PowerShellDataFile .\source\PowerStig.psd1).ModuleVersion
          $package = Join-Path $PWD "Tools\Deployment\Packages\PowerStig-Windows-Offline-$version.ps1"
          $extractRoot = Join-Path $env:RUNNER_TEMP 'PowerStigOfflineSmokeTest'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -NoProfile -ExecutionPolicy Bypass -File $package `
              -Mode Deploy -WhatIf -Target WindowsServer2025 -ServerRole DC -ExtractRoot $extractRoot
          if ($LASTEXITCODE -ne 0) {
              throw "Deploy -WhatIf failed with exit code $LASTEXITCODE."
          }

          $deploymentSummary = Get-ChildItem (Join-Path $extractRoot 'Scripts\Logs') -Filter 'Deploy-PowerStig-*.summary.json' -File |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          if (-not $deploymentSummary) {
              throw 'The Windows Server 2025 DC WhatIf compile did not produce a deployment summary.'
          }

          $deployment = Get-Content $deploymentSummary.FullName -Raw | ConvertFrom-Json
          if (-not $deployment.Succeeded -or $deployment.Applied -or -not $deployment.WhatIf -or $deployment.Target.ServerRole -ne 'DC') {
              throw 'The offline package did not successfully compile the Windows Server 2025 DC profile in WhatIf mode.'
          }

          $mofContent = Get-Content -LiteralPath $deployment.MofPath -Raw
          if ($mofContent -notmatch '\[NTFSAccessEntry\]\[V-278139\]' -or $mofContent -notmatch '\[RegistryPolicyFile\]\[V-278103\]' -or $mofContent -match 'V-278001\.c') {
              throw 'The generated DC MOF does not contain the expected automated resources and manual exception.'
          }

      - name: Run read-only compliance check
        shell: powershell
        run: |
          $version = (Import-PowerShellDataFile .\source\PowerStig.psd1).ModuleVersion
          $package = Join-Path $PWD "Tools\Deployment\Packages\PowerStig-Windows-Offline-$version.ps1"
          $extractRoot = Join-Path $env:RUNNER_TEMP 'PowerStigOfflineSmokeTest'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -NoProfile -ExecutionPolicy Bypass -File $package `
              -Mode Check -ExtractRoot $extractRoot
          $checkExitCode = $LASTEXITCODE

          $summary = Get-ChildItem (Join-Path $extractRoot 'Scripts\Logs') -Filter 'Test-PowerStig-*.summary.json' -File |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          if (-not $summary) {
              throw "Compliance check did not produce a summary (process exit code $checkExitCode)."
          }

          $result = Get-Content $summary.FullName -Raw | ConvertFrom-Json
          if (-not $result.Succeeded) {
              throw "Compliance check execution failed: $($result.Error)"
          }
          Write-Host "Compliance check executed successfully. InDesiredState=$($result.InDesiredState); exit code=$checkExitCode."
            $global:LASTEXITCODE = 0

      - name: Upload offline package
        uses: actions/upload-artifact@v4
        with:
          name: PowerStig-Windows-Offline-${{ steps.package.outputs.version }}
          path: ${{ runner.temp }}/PowerStigOfflineArtifact/
          if-no-files-found: error
          retention-days: 30
